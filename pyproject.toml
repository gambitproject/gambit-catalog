# Configuration for the catalog's tooling. The catalog is a dataset, not a Python package.

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "catalog_update: tests of build.py",
]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "Q", "W"]

[tool.ruff.format]
quote-style = "double"
